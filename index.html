<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LexiKyrgyz</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="icon_lexikyr.ico" type="image/x-icon">
  <link rel="shortcut icon" href="icon_lexikyr.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="icon_lexikyr.ico">
</head>
<body>

  <div class="page-wrapper">

    <div class="dictionary-wrapper">
      <header class="dictionary-header">
        <div class="header-content">
          <h1 id="title">LexiKyrgyz</h1>
          <p class="tagline">Kyrgyz → English learner's dictionary</p>
          <p class="tagline">Demo version</p>
        </div>
        <div class="auth-container">
          <div class="auth-indicator" id="authIndicator"></div>
          <div class="user-dropdown" id="userDropdown"></div>
        </div>
      </header>

      <div class="control-bar">
        <div class="search-container">
          <input type="text" class="search-input" id="searchInput" placeholder="Search in Kyrgyz or English…" autocomplete="off">
          <div id="searchSuggestions" class="search-suggestions"></div>
          <div class="button-group">
            <button class="random-btn" id="randomBtn">🎲 Random Word</button>
            <button class="exercise-btn" id="exerciseBtn">🤓 Test Yourself</button>
            <button class="review-btn" id="reviewBtn" disabled>🔁 Review Saved</button>
            <button class="keyboard-toggle-btn" id="keyboardToggleBtn">⌨️ Show Keyboard</button>
          </div>

          <div class="virtual-keyboard" id="virtualKeyboard" style="display: none;">
            <div class="keyboard-content">
              <div class="keyboard-row">
                <button class="key">й</button>
                <button class="key">ц</button>
                <button class="key">у</button>
                <button class="key">к</button>
                <button class="key">е</button>
                <button class="key">н</button>
                <button class="key">г</button>
                <button class="key">ш</button>
                <button class="key">ү</button>
                <button class="key">з</button>
              </div>
              <div class="keyboard-row">
                <button class="key">х</button>
                <button class="key">ъ</button>
                <button class="key">ф</button>
                <button class="key">ы</button>
                <button class="key">в</button>
                <button class="key">а</button>
                <button class="key">п</button>
                <button class="key">р</button>
                <button class="key">о</button>
                <button class="key">л</button>
              </div>
              <div class="keyboard-row">
                <button class="key">д</button>
                <button class="key">ж</button>
                <button class="key">э</button>
                <button class="key">я</button>
                <button class="key">ч</button>
                <button class="key">с</button>
                <button class="key">м</button>
                <button class="key">и</button>
                <button class="key">т</button>
                <button class="key">ь</button>
              </div>
              <div class="keyboard-row">
                <button class="key">б</button>
                <button class="key">ю</button>
                <button class="key">ө</button>
                <button class="key">ң</button>
                <button class="key">ё</button>
                <button class="key">щ</button>
                <button class="key wide" data-action="space">Space</button>
                <button class="key" data-action="backspace">⌫</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <main class="results-container" id="resultsContainer">
        <div class="about-section" id="aboutSection">
          <div class="section-title">About</div>
          <p class="about-content">bla blabla bla</p>
        </div>
      </main>

      <div class="filter-modal" id="filterModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="modalTitle">Nouns</h3>
            <button class="close-modal" id="closeModal">×</button>
          </div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>

      <div class="exercise-modal" id="exerciseModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Vocabulary exercise:</h3>
            <button class="close-modal" id="closeExerciseModal">×</button>
          </div>
          <div class="modal-body" id="exerciseModalBody"></div>
        </div>
      </div>

      <div class="saved-modal" id="savedModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Saved Words</h3>
            <button class="close-modal" id="closeSavedModal">×</button>
          </div>
          <div class="modal-body" id="savedModalBody"></div>
        </div>
      </div>

      <div class="flashcard-modal" id="flashcardModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Review Saved</h3>
            <button class="close-modal" id="closeFlashcardModal">×</button>
          </div>
          <div class="modal-body" id="flashcardModalBody"></div>
        </div>
      </div>

      <div class="auth-modal" id="authModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="authModalTitle">Sign In</h3>
            <button class="close-modal" id="closeAuthModal">×</button>
          </div>
          <div class="modal-body" id="authModalBody">
            <form id="authForm">
              <div class="form-group">
                <input type="email" id="emailInput" placeholder="Email" required autocomplete="email">
              </div>
              <div class="form-group">
                <input type="password" id="passwordInput" placeholder="Password" required autocomplete="new-password">
              </div>
              <div class="auth-buttons">
                <button type="submit" class="auth-btn auth-signin">Sign In</button>
                <button type="button" class="auth-btn auth-signup">Sign Up</button>
              </div>
              <p class="auth-toggle" id="authToggle">New here? <a href="#" id="toggleAuth">Create an account</a></p>
            </form>
          </div>
        </div>
      </div>

      <footer class="dictionary-footer">
        <p>© 2025 LexiKyrgyz — Created by <a href="https://www.linkedin.com/in/mikko-fidias-phd-362379237/" target="_blank" class="university-link">Mikko</a></p>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js" defer></script>
  <script data-goatcounter="https://lexidictionary.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  
</body>
</html>
